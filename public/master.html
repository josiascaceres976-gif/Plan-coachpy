<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17201B">
<meta name="robots" content="noindex">
<title>Plan Coach Master</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: panel de una columna para celular — resumen arriba, lista de profesionales, hojas inferiores para acciones */
:root{
  --bg:#EDF0EA; --surface:#FFFFFF; --sunk:#E3E8E1; --ink:#17201B; --muted:#5A6960; --line:#D3DBD1;
  --accent:#1F55F0; --accent-soft:#E2E9FF; --on-accent:#FFFFFF;
  --ok:#1C7F47; --ok-soft:#DDF1E4; --due:#C23D28; --due-soft:#FBE3DE; --warn:#A86A00; --warn-soft:#FBEFD6;
  --master:#17201B; --on-master:#EDF0EA;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0F1411; --surface:#18201B; --sunk:#121915; --ink:#E6ECE7; --muted:#94A59B; --line:#2A352E;
  --accent:#7192FF; --accent-soft:#1E2A4D; --on-accent:#0B1020;
  --ok:#5BC98A; --ok-soft:#163423; --due:#FF8A75; --due-soft:#3A1E19; --warn:#E3A93C; --warn-soft:#352812;
  --master:#E6ECE7; --on-master:#0F1411; color-scheme:dark}}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--master)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--master);color:var(--on-master)}
header .wrap{display:flex;align-items:center;gap:10px;padding-block:12px;min-height:60px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.logo svg{width:22px;height:22px}
.brand{font-family:var(--display);font-weight:700;font-size:24px;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.brand small{display:block;font-size:12px;letter-spacing:.14em;opacity:.65}
.hbtn{margin-left:auto;border:1px solid currentColor;background:transparent;border-radius:10px;padding:7px 12px;font-weight:600;font-size:13px;opacity:.85}
main .wrap{padding-block:16px 110px;display:flex;flex-direction:column;gap:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;border:0;text-align:left;min-width:0}
.stat .v{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--muted);margin-top:3px}
.stat[aria-pressed="true"]{outline:2px solid var(--ink)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;width:100%;min-width:0}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.av{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px;flex:none}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;border-radius:20px;padding:2px 9px;white-space:nowrap}
.c-ok{background:var(--ok-soft);color:var(--ok)}.c-due{background:var(--due-soft);color:var(--due)}.c-warn{background:var(--warn-soft);color:var(--warn)}.c-acc{background:var(--accent-soft);color:var(--accent)}.c-n{background:var(--sunk);color:var(--muted)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--sunk);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink);min-height:46px;text-align:center}
.btn.pri{background:var(--accent);color:var(--on-accent)}.btn.wa{background:var(--ok);color:#fff}.btn.danger{background:var(--due-soft);color:var(--due)}.btn.full{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns>.btn{flex:1 1 140px}
.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:24;border:0;border-radius:16px;background:var(--accent);color:var(--on-accent);font-weight:700;padding:15px 20px;box-shadow:0 6px 18px rgba(20,40,120,.3)}
.h-sec{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:0}.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.5);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.sheet .wrap{padding-block:8px 4px;display:flex;flex-direction:column;gap:14px}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 0}
.sheet h2{font-family:var(--display);font-weight:700;font-size:26px;text-transform:uppercase;margin:0;text-wrap:balance}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label{font-size:13px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.codigo{font-family:var(--display);font-weight:700;font-size:40px;letter-spacing:.08em;text-align:center;background:var(--sunk);border-radius:14px;padding:12px;user-select:all;font-variant-numeric:tabular-nums}
.msg{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;min-height:150px;width:100%}
.note{font-size:12.5px;color:var(--muted);margin:0}
.copy{display:flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.copy code{flex:1;min-width:0;overflow-wrap:anywhere;font-size:13px}
.login{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.login form{width:min(100%,380px);display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px}
.login h1{font-family:var(--display);font-weight:700;font-size:30px;text-transform:uppercase;margin:0}
.err{background:var(--due-soft);color:var(--due);border-radius:10px;padding:10px 12px;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:90%;text-align:center}
@media (max-width:420px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="loginView" class="login" hidden>
  <form id="loginForm">
    <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg></span>
    <h1>Panel Master</h1>
    <div class="f"><label for="lEmail">Correo</label><input id="lEmail" type="email" autocomplete="username" required></div>
    <div class="f"><label for="lClave">Contraseña</label><input id="lClave" type="password" autocomplete="current-password" required></div>
    <div class="err" id="lErr" hidden></div>
    <button class="btn pri full" type="submit">Entrar</button>
  </form>
</div>

<div id="appView" hidden>
  <header><div class="wrap"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg></span><div class="brand">Plan Coach<small>Panel master</small></div><button class="hbtn" data-act="ajustes">Ajustes</button></div></header>
  <main><div class="wrap" id="view"></div></main>
  <button class="fab" data-act="nuevo">+ Profesional</button>
</div>
<div id="sheetHost"></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const SITE=location.origin;
let PROS=[], AJ={whatsapp:'',nombre:'Plan Coach'}, FILTRO='todos', Q='';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function fmt(f){if(!f)return'—';const d=new Date(f);if(isNaN(d))return f;return d.getDate()+' '+MES[d.getMonth()]+' '+d.getFullYear();}
function fmtD(s){if(!s)return'—';const[y,m,d]=String(s).slice(0,10).split('-');return +d+' '+MES[+m-1]+' '+y;}
function hace(f){if(!f)return'nunca';const d=Math.floor((Date.now()-new Date(f))/864e5);return d<=0?'hoy':d===1?'ayer':'hace '+d+' días';}
function waNum(t){let d=String(t||'').replace(/\D/g,'');if(!d)return'';if(d.startsWith('0'))d='595'+d.slice(1);else if(d.length===9&&d.startsWith('9'))d='595'+d;return d;}
const wa=(t,txt)=>'https://wa.me/'+waNum(t)+'?text='+encodeURIComponent(txt);
let tt;function toast(m){const el=$('toast');el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,2600);}

async function api(path,opt={}){
  const r=await fetch('/api'+path,{method:opt.method||'GET',headers:opt.body?{'content-type':'application/json'}:{},body:opt.body?JSON.stringify(opt.body):undefined,credentials:'same-origin'});
  let b={};try{b=await r.json();}catch(e){}
  if(r.status===401&&path!=='/master/login'){mostrarLogin();throw new Error(b.error||'Ingresá al panel.');}
  if(!r.ok)throw new Error(b.error||'No se pudo completar.');
  return b;
}
function mostrarLogin(){$('appView').hidden=true;$('loginView').hidden=false;}
$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();$('lErr').hidden=true;
  try{await api('/master/login',{method:'POST',body:{email:$('lEmail').value,clave:$('lClave').value}});await cargar();}
  catch(err){$('lErr').textContent=err.message;$('lErr').hidden=false;}
});

async function cargar(){
  const r=await api('/master/pros');PROS=r.pros;AJ=r.ajustes||AJ;
  $('loginView').hidden=true;$('appView').hidden=false;render();
}
function estadoDe(p){
  if(!p.acceso){return p.estado==='bloqueado'?['bloqueado','Bloqueado','c-due']:p.estado==='prueba'?['vencido','Prueba terminada','c-due']:['vencido','Suscripción vencida','c-due'];}
  if(p.estado==='prueba')return ['prueba',(p.diasPrueba===1?'1 día de prueba':p.diasPrueba+' días de prueba'),p.diasPrueba<=3?'c-warn':'c-acc'];
  return ['activo',p.activoHasta?'Activo hasta '+fmtD(p.activoHasta):'Activo','c-ok'];
}
function render(){
  const c={todos:PROS.length,prueba:0,activo:0,inactivo:0};
  PROS.forEach(p=>{const e=estadoDe(p)[0];if(e==='prueba')c.prueba++;else if(e==='activo')c.activo++;else c.inactivo++;});
  const q=Q.trim().toLowerCase();
  const lista=PROS.filter(p=>{const e=estadoDe(p)[0];
    if(FILTRO==='prueba'&&e!=='prueba')return false;if(FILTRO==='activo'&&e!=='activo')return false;if(FILTRO==='inactivo'&&e!=='bloqueado'&&e!=='vencido')return false;
    return !q||(p.nombre+' '+p.email+' '+(p.telefono||'')).toLowerCase().includes(q);});
  const st=(k,v,l,col)=>`<button class="stat" data-act="filtro" data-k="${k}" aria-pressed="${FILTRO===k}"><div class="v" style="color:${col}">${v}</div><div class="l">${l}</div></button>`;
  $('view').innerHTML=`
   <div class="stats">${st('todos',c.todos,'profesionales','inherit')}${st('prueba',c.prueba,'en prueba','var(--accent)')}${st('activo',c.activo,'activos','var(--ok)')}${st('inactivo',c.inactivo,'bloqueados o vencidos','var(--due)')}</div>
   <input class="search" id="q" type="search" placeholder="Buscar por nombre, correo o teléfono" value="${esc(Q)}" aria-label="Buscar profesional">
   <div id="lista">${listaHTML(lista)}</div>`;
}
function listaHTML(lista){
  if(!PROS.length)return `<div class="empty"><b>Todavía no hay profesionales</b><br>Cuando se registren desde tu link o los des de alta, aparecen acá.</div>`;
  if(!lista.length)return `<div class="empty">Nadie coincide con ese filtro.</div>`;
  return `<div class="list">${lista.map(p=>{const[,l,c]=estadoDe(p);return `<button class="row" data-act="ver" data-id="${p.id}"><div class="av">${esc((p.nombre||'?')[0].toUpperCase())}</div><div class="main"><div class="t">${esc(p.nombre)}</div><div class="s">${esc(p.email)} · ${p.alumnos} alumno${p.alumnos===1?'':'s'} · ${hace(p.ultimoIngreso)}</div></div><span class="chip ${c}">${esc(l)}</span></button>`}).join('')}</div>`;
}

/* hojas */
function sheet(html){$('sheetHost').innerHTML=`<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div class="wrap">${html}</div></div>`;}
const close=()=>{$('sheetHost').innerHTML='';};
const val=id=>{const e=$(id);return e?e.value.trim():'';};

function mensajeAcceso(p,codigo,reset){
  return `Hola ${String(p.nombre).split(' ')[0]} 👋 ${reset?'Te generé un código nuevo para entrar a':'Ya tenés tu acceso a'} *Plan Coach*.\n\n🌐 ${SITE}\n📧 Correo: ${p.email}\n🔑 Código: ${codigo}\n\nAl entrar te va a pedir que crees tu propia contraseña.`;
}
function hojaCodigo(p,codigo,reset){
  const txt=mensajeAcceso(p,codigo,reset);
  sheet(`<h2>${reset?'Código nuevo':'Profesional creado'}</h2>
  <p class="note">${reset?'La contraseña anterior ya no sirve.':''} Pasale este código a ${esc(p.nombre)}. Al ingresar, el sistema le pide crear su propia contraseña.</p>
  <div class="codigo">${esc(codigo)}</div>
  <div class="f"><label for="msgTxt">Mensaje para enviarle</label><textarea id="msgTxt" class="msg">${esc(txt)}</textarea></div>
  ${p.telefono?`<a class="btn wa full" id="waGo" href="${wa(p.telefono,txt)}" target="_blank" rel="noopener">Enviar por WhatsApp</a>`:'<p class="note">No cargaste su teléfono: copiá el mensaje y mandáselo.</p>'}
  <button class="btn full" data-act="copiar" data-from="msgTxt">Copiar mensaje</button>
  <p class="note">Por seguridad, este código se muestra una sola vez. Si se pierde, generá otro.</p>`);
  const ta=$('msgTxt'),go=$('waGo');if(go)ta.addEventListener('input',()=>go.href=wa(p.telefono,ta.value));
}
function hojaNuevo(){
  sheet(`<h2>Nuevo profesional</h2>
  <div class="f"><label for="nNom">Nombre y apellido</label><input id="nNom" autocomplete="off"></div>
  <div class="f"><label for="nEmail">Correo (con este ingresa)</label><input id="nEmail" type="email" autocomplete="off"></div>
  <div class="f"><label for="nTel">WhatsApp</label><input id="nTel" inputmode="tel" placeholder="0981 123 456"></div>
  <div class="grid2"><div class="f"><label for="nTipo">Tipo de acceso</label><select id="nTipo"><option value="activo">Activo (pagó)</option><option value="prueba">Prueba de 15 días</option></select></div>
  <div class="f"><label for="nHasta">Activo hasta (opcional)</label><input id="nHasta" type="date"></div></div>
  <p class="note">Se genera un código de acceso. Con ese código entra la primera vez y crea su propia contraseña.</p>
  <button class="btn pri full" data-act="crear">Crear y generar código</button>`);
}
function hojaVer(id){
  const p=PROS.find(x=>x.id==id);if(!p)return;const[e,l,c]=estadoDe(p);
  const hoy=new Date();const en30=new Date(hoy.getTime()+30*864e5).toISOString().slice(0,10);
  sheet(`<h2>${esc(p.nombre)}</h2><span class="chip ${c}" style="align-self:flex-start">${esc(l)}</span>
  <dl class="kv"><dt>Correo</dt><dd>${esc(p.email)}</dd><dt>WhatsApp</dt><dd>${esc(p.telefono||'—')}</dd><dt>Alta</dt><dd>${fmt(p.creado)} · ${p.origen==='registro'?'se registró solo':'lo diste de alta'}</dd>
  <dt>Último ingreso</dt><dd>${hace(p.ultimoIngreso)}</dd><dt>Alumnos</dt><dd>${p.alumnos}</dd><dt>Avisos</dt><dd>${p.dispositivos?'activados en '+p.dispositivos+' dispositivo'+(p.dispositivos>1?'s':''):'sin activar'}</dd>
  ${p.estado==='prueba'?`<dt>Prueba hasta</dt><dd>${fmt(p.pruebaHasta)}</dd>`:''}</dl>
  ${p.telefono?`<a class="btn wa full" href="${wa(p.telefono,'Hola '+String(p.nombre).split(' ')[0]+' 👋 ')}" target="_blank" rel="noopener">Escribirle por WhatsApp</a>`:''}
  <div class="card" style="background:var(--bg)"><div class="h-sec">Activar suscripción</div>
   <div class="f"><label for="aHasta">Pagó hasta (vacío = sin vencimiento)</label><input id="aHasta" type="date" value="${p.activoHasta||en30}"></div>
   <button class="btn pri full" data-act="activar" data-id="${p.id}">${e==='activo'?'Actualizar fecha':'Activar'}</button></div>
  <div class="btns"><button class="btn" data-act="extender" data-id="${p.id}">+15 días de prueba</button><button class="btn" data-act="reset" data-id="${p.id}">Resetear contraseña</button></div>
  ${e!=='bloqueado'?`<button class="btn danger full" data-act="bloquear" data-id="${p.id}">Bloquear acceso</button>`:''}
  <div class="card" style="background:var(--bg)"><div class="h-sec">Datos y notas</div>
   <div class="f"><label for="eNom">Nombre</label><input id="eNom" value="${esc(p.nombre)}"></div>
   <div class="grid2"><div class="f"><label for="eEmail">Correo</label><input id="eEmail" type="email" value="${esc(p.email)}"></div><div class="f"><label for="eTel">WhatsApp</label><input id="eTel" value="${esc(p.telefono||'')}"></div></div>
   <div class="f"><label for="eNota">Nota interna</label><textarea id="eNota" rows="3" placeholder="Ej.: pagó por transferencia, plan anual…">${esc(p.nota||'')}</textarea></div>
   <button class="btn full" data-act="guardar" data-id="${p.id}">Guardar cambios</button></div>`);
}
function hojaAjustes(){
  const links=[['Link para TikTok (registro con 15 días gratis)',SITE+'/#probar'],['Demo sin cuenta',SITE+'/demo'],['Guía de ejercicios',SITE+'/guia'],['App de los profesionales',SITE+'/']];
  sheet(`<h2>Ajustes</h2>
  <div class="h-sec">Tus links</div>
  ${links.map(([l,u],i)=>`<div class="f"><label>${esc(l)}</label><div class="copy"><code id="lk${i}">${esc(u)}</code><button class="btn" style="min-height:34px;padding:6px 12px;font-size:13px" data-act="copiar" data-from="lk${i}">Copiar</button></div></div>`).join('')}
  <div class="h-sec">Soporte</div>
  <p class="note">Este WhatsApp aparece cuando a un profesional se le termina la prueba o se le bloquea la cuenta, para que te escriba.</p>
  <div class="grid2"><div class="f"><label for="sWa">Tu WhatsApp</label><input id="sWa" inputmode="tel" value="${esc(AJ.whatsapp)}" placeholder="0981 123 456"></div><div class="f"><label for="sNom">Nombre que ven</label><input id="sNom" value="${esc(AJ.nombre)}"></div></div>
  <button class="btn pri full" data-act="guardarAj">Guardar</button>
  <button class="btn full" data-act="salir">Cerrar sesión del panel</button>`);
}

async function accion(id,body,msg){
  const r=await api('/master/pros/'+id,{method:'POST',body});
  await cargar();
  if(r.codigo){const p=PROS.find(x=>x.id==id);hojaCodigo(p,r.codigo,true);}else{close();if(msg)toast(msg);}
}
let armado=null;
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const d=t.dataset;
  try{
    switch(d.act){
      case 'close':close();break;
      case 'filtro':FILTRO=d.k;render();break;
      case 'nuevo':hojaNuevo();break;
      case 'ajustes':hojaAjustes();break;
      case 'ver':hojaVer(d.id);break;
      case 'crear':{t.disabled=true;
        const r=await api('/master/pros',{method:'POST',body:{nombre:val('nNom'),email:val('nEmail'),telefono:val('nTel'),estado:val('nTipo'),hasta:val('nHasta')||null}}).finally(()=>t.disabled=false);
        await cargar();hojaCodigo({...r.pro,telefono:val('nTel')||r.pro.telefono},r.codigo,false);break;}
      case 'activar':await accion(d.id,{accion:'activar',hasta:val('aHasta')||null},'Suscripción activada');break;
      case 'extender':await accion(d.id,{accion:'extender',dias:15},'Se sumaron 15 días de prueba');break;
      case 'reset':if(armado!==t){armado=t;t.textContent='¿Seguro? Tocá de nuevo';setTimeout(()=>{if(armado===t){armado=null;t.textContent='Resetear contraseña';}},3500);break;}
        armado=null;await accion(d.id,{accion:'reset'});break;
      case 'bloquear':if(armado!==t){armado=t;t.textContent='Tocá de nuevo para bloquear';setTimeout(()=>{if(armado===t){armado=null;t.textContent='Bloquear acceso';}},3500);break;}
        armado=null;await accion(d.id,{accion:'bloquear'},'Acceso bloqueado');break;
      case 'guardar':await accion(d.id,{accion:'editar',nombre:val('eNom'),email:val('eEmail'),telefono:val('eTel'),nota:val('eNota')},'Cambios guardados');break;
      case 'guardarAj':{const r=await api('/master/ajustes',{method:'POST',body:{soporte_whatsapp:val('sWa'),soporte_nombre:val('sNom')}});AJ=r.ajustes;close();toast('Ajustes guardados');break;}
      case 'copiar':{const el=$(d.from);const txt=el.value!=null&&el.tagName==='TEXTAREA'?el.value:el.textContent;
        try{await navigator.clipboard.writeText(txt);toast('Copiado');}catch(err){if(el.select){el.focus();el.select();}toast('Seleccionalo y copialo');}break;}
      case 'salir':await api('/master/salir',{method:'POST'});close();mostrarLogin();break;
    }
  }catch(err){toast(err.message);}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){Q=e.target.value;const q=Q.trim().toLowerCase();
  $('lista').innerHTML=listaHTML(PROS.filter(p=>{const s=estadoDe(p)[0];if(FILTRO==='prueba'&&s!=='prueba')return false;if(FILTRO==='activo'&&s!=='activo')return false;if(FILTRO==='inactivo'&&s!=='bloqueado'&&s!=='vencido')return false;return !q||(p.nombre+' '+p.email+' '+(p.telefono||'')).toLowerCase().includes(q);}));}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});
cargar().catch(()=>mostrarLogin());
})();
</script>

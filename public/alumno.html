<style>
/* Layout: app del alumno, una columna — saludo, lo de hoy, rutina ilustrada, comidas, cuota y progreso */
:root{
  --bg:#EDF0EA; --surface:#FFFFFF; --sunk:#E3E8E1; --ink:#17201B; --muted:#5A6960; --line:#D3DBD1;
  --accent:#1F55F0; --accent-soft:#E2E9FF; --on-accent:#FFFFFF;
  --ok:#1C7F47; --ok-soft:#DDF1E4; --due:#C23D28; --due-soft:#FBE3DE; --warn:#A86A00; --warn-soft:#FBEFD6;
  --ej-ink:#17201B; --ej-far:#9AA79F; --ej-eq:#5A6960; --ej-ground:#C9D2C7; --ej-pad:#C9D2C7;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0F1411; --surface:#18201B; --sunk:#121915; --ink:#E6ECE7; --muted:#94A59B; --line:#2A352E;
  --accent:#7192FF; --accent-soft:#1E2A4D; --on-accent:#0B1020;
  --ok:#5BC98A; --ok-soft:#163423; --due:#FF8A75; --due-soft:#3A1E19; --warn:#E3A93C; --warn-soft:#352812;
  --ej-ink:#E6ECE7; --ej-far:#5E6D64; --ej-eq:#94A59B; --ej-ground:#2F3B33; --ej-pad:#344038; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hero{background:var(--accent);color:var(--on-accent)}
.hero .wrap{padding-block:calc(22px + env(safe-area-inset-top,0px)) 22px;display:flex;flex-direction:column;gap:6px}
.hero small{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.8;font-weight:600}
.hero h1{font-family:var(--display);font-weight:700;font-size:38px;line-height:1;text-transform:uppercase;margin:0;text-wrap:balance}
.hero p{margin:0;opacity:.9}
main .wrap{padding-block:16px 40px;display:flex;flex-direction:column;gap:18px}
section{display:flex;flex-direction:column;gap:8px;scroll-margin-top:12px}
.h-sec{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.big{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.05;text-transform:uppercase}
.muted{color:var(--muted)}.small{font-size:13px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--sunk);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink);min-height:46px;text-align:center;width:100%}
.btn.pri{background:var(--accent);color:var(--on-accent)}.btn.wa{background:var(--ok);color:#fff}
.chip{display:inline-flex;font-size:12px;font-weight:600;border-radius:20px;padding:2px 9px;white-space:nowrap}
.c-ok{background:var(--ok-soft);color:var(--ok)}.c-due{background:var(--due-soft);color:var(--due)}.c-warn{background:var(--warn-soft);color:var(--warn)}.c-acc{background:var(--accent-soft);color:var(--accent)}
.meal{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.meal:first-of-type{border-top:0;padding-top:0}
.meal .hd{display:flex;gap:10px;align-items:baseline}
.meal .hd b{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums;width:54px;flex:none}
.meal .hd span{font-weight:600;flex:1;min-width:0}
.meal details summary{color:var(--accent);font-size:13px;cursor:pointer;margin-left:64px}
.meal pre{white-space:pre-wrap;font-family:var(--body);font-size:13.5px;background:var(--sunk);border-radius:10px;padding:10px;margin:6px 0 0}
.days{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.days button{flex:1 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font-weight:600;font-size:13px;color:var(--muted)}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.zona{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.02em;margin:6px 0 -2px}
.zona span{font-size:22px}
.ej{display:grid;grid-template-columns:124px 1fr;gap:12px;align-items:start;border-top:1px solid var(--line);padding-top:12px}
.zona+.ej{border-top:0;padding-top:4px}
.ej .ill{background:#fff;border-radius:12px;overflow:hidden;aspect-ratio:1/1}
.ej .nom{font-weight:700;font-size:17px;line-height:1.2}
.dosis{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.dosis div{background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:5px 9px;line-height:1.05;text-align:center;min-width:58px}
.dosis div.gris{background:var(--sunk);color:var(--ink)}
.dosis b{display:block;font-family:var(--display);font-size:21px}
.dosis small{font-size:11.5px;font-weight:600}
.ej details{grid-column:1/-1;background:var(--sunk);border-radius:10px;padding:8px 12px}
.ej summary{font-weight:600;color:var(--accent);cursor:pointer;font-size:14.5px}
.ej details ol{margin:8px 0 4px;padding-left:20px;font-size:15px;line-height:1.45}
.ej details p{margin:4px 0 2px;font-size:14px}
.ej .ill svg,.ej .ill img{width:100%;height:100%;display:block;object-fit:contain}
.ej .ill.none{display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;padding:6px}
.ej .tip{font-size:13px;color:var(--muted);margin-top:4px}
.ej a{display:inline-block;margin-top:6px;color:var(--accent);font-weight:600;font-size:13.5px;text-decoration:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.stat .v{font-family:var(--display);font-weight:700;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--muted);margin-top:3px}
.rec{display:flex;gap:10px;align-items:baseline;border-top:1px solid var(--line);padding-top:8px}
.rec:first-of-type{border-top:0;padding-top:0}
.rec b{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13px;color:var(--muted)}
.empty{padding:20px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:16px}
.note{font-size:12.5px;color:var(--muted);margin:0}
</style>
</head>

<div class="hero"><div class="wrap"><small id="eyebrow">Mi entrenamiento</small><h1 id="hola">Hola</h1><p id="sub"></p></div></div>
<main><div class="wrap" id="view"><div class="empty"><b>Cargando…</b></div></div></main>
<script>
/* ===== Ilustraciones de ejercicios: figura de perfil animada entre dos posiciones ===== */
var EJ=(function(){
const LEN={torso:52,thigh:40,shin:40,ua:30,fa:28,neck:13,foot:11};
const F=190; // piso
const dir=a=>{const r=a*Math.PI/180;return [Math.sin(r),-Math.cos(r)];};
const add=(p,l,a)=>{const d=dir(a);return [p[0]+d[0]*l,p[1]+d[1]*l];};
const angTo=(a,b)=>Math.atan2(b[0]-a[0],-(b[1]-a[1]))*180/Math.PI;
function ik(base,t,a,b,bend){
  let dx=t[0]-base[0],dy=t[1]-base[1];let d=Math.hypot(dx,dy);
  const dm=Math.min(a+b-0.01,Math.max(Math.abs(a-b)+0.01,d));
  const ux=dx/(d||1),uy=dy/(d||1);
  const ca=(a*a+dm*dm-b*b)/(2*a*dm),al=Math.acos(Math.max(-1,Math.min(1,ca)));
  const phi=Math.atan2(uy,ux);
  const c1=[base[0]+a*Math.cos(phi+al),base[1]+a*Math.sin(phi+al)];
  const c2=[base[0]+a*Math.cos(phi-al),base[1]+a*Math.sin(phi-al)];
  let j;
  if(bend==='f')j=c1[0]>=c2[0]?c1:c2;else if(bend==='b')j=c1[0]<c2[0]?c1:c2;
  else if(bend==='u')j=c1[1]<c2[1]?c1:c2;else j=c1[1]>=c2[1]?c1:c2;
  const end=[base[0]+ux*dm,base[1]+uy*dm];
  // extremo real desde la articulación
  const e2=[j[0]+(end[0]-j[0])*b/Math.hypot(end[0]-j[0],end[1]-j[1]),j[1]+(end[1]-j[1])*b/Math.hypot(end[0]-j[0],end[1]-j[1])];
  return [j,e2];
}
function fk(p){
  const P={hip:p.hip};
  const torso=p.torsoTo?angTo(p.hip,p.torsoTo):p.torso;
  P.sh=add(P.hip,LEN.torso,torso);
  P.head=add(P.sh,LEN.neck,torso+(p.head||0));
  const leg=(s)=>{const t=p['ank'+s];let k,a;
    if(t){[k,a]=ik(P.hip,t,LEN.thigh,LEN.shin,t[2]||'f');}
    else{k=add(P.hip,LEN.thigh,p['thigh'+s]??p.thigh);a=add(k,LEN.shin,p['shin'+s]??p.shin);}
    P['knee'+s]=k;P['ank'+s]=a;P['toe'+s]=add(a,LEN.foot,p['foot'+s]??p.foot??90);};
  const arm=(s)=>{const t=p['hand'+s]||(s&&p.hand);let e,h;
    if(t){[e,h]=ik(P.sh,t,LEN.ua,LEN.fa,t[2]||'d');}
    else{e=add(P.sh,LEN.ua,p['arm'+s]??p.arm);h=add(e,LEN.fa,p['fore'+s]??p.fore);}
    P['elb'+s]=e;P['hand'+s]=h;};
  leg('');leg('2');arm('');arm('2');
  return P;
}
function lerp(a,b,t){
  if(typeof a==='number')return a+(b-a)*t;
  if(Array.isArray(a))return a.map((v,i)=>typeof v==='number'?v+(b[i]-v)*t:v);
  return a;
}
function mix(A,B,t){const o={};for(const k in A)o[k]=(k in B)?lerp(A[k],B[k],t):A[k];return o;}
const r1=n=>Math.round(n*10)/10;
const ln=(a,b,w,c,op)=>`<line x1="${r1(a[0])}" y1="${r1(a[1])}" x2="${r1(b[0])}" y2="${r1(b[1])}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"${op?` opacity="${op}"`:''}/>`;
const circ=(p,r,c,extra)=>`<circle cx="${r1(p[0])}" cy="${r1(p[1])}" r="${r}" fill="${c}"${extra||''}/>`;
const C={ink:'var(--ej-ink,#17201B)',far:'var(--ej-far,#9AA79F)',eq:'var(--ej-eq,#5A6960)',acc:'var(--ej-acc,#1F55F0)',ground:'var(--ej-ground,#D3DBD1)',pad:'var(--ej-pad,#C9D2C7)'};
const plate=(p,r)=>circ(p,r,C.eq)+circ(p,r*0.35,C.pad)+circ(p,2.2,C.eq);
const disc=p=>`<rect x="${r1(p[0]-4)}" y="${r1(p[1]-8)}" width="8" height="16" rx="3" fill="${C.eq}"/>`;
const goblet=p=>`<rect x="${r1(p[0]-6)}" y="${r1(p[1]-13)}" width="12" height="26" rx="4" fill="${C.eq}"/>`;
const floor=`<line x1="0" y1="${F+1}" x2="200" y2="${F+1}" stroke="${C.ground}" stroke-width="3"/>`;
function body(P,o){
  o=o||{};let s='';
  s+=ln(P.sh,P.elb2,8,C.far)+ln(P.elb2,P.hand2,7,C.far);
  s+=ln(P.hip,P.knee2,10,C.far)+ln(P.knee2,P.ank2,8,C.far)+ln(P.ank2,P.toe2,6,C.far);
  s+=ln(P.hip,P.sh,15,C.ink);
  s+=ln(P.hip,P.knee,10,C.ink)+ln(P.knee,P.ank,8,C.ink)+ln(P.ank,P.toe,6,C.ink);
  s+=circ(P.head,10,C.ink);
  s+=ln(P.sh,P.elb,8,C.ink)+ln(P.elb,P.hand,7,C.ink);
  return s;
}
/* ---- vista de frente (solo elevaciones laterales) ---- */
function front(a){
  const cx=100,sy=58,hy=110;let s='';
  const arm=(sg)=>{const sh=[cx+sg*14,sy];const d=[sg*Math.sin(a*Math.PI/180),Math.cos(a*Math.PI/180)];
    const e=[sh[0]+d[0]*30,sh[1]+d[1]*30];const h=[e[0]+d[0]*27,e[1]+d[1]*27];
    return ln(sh,e,8,C.ink)+ln(e,h,7,C.ink)+`<rect x="${r1(h[0]-8)}" y="${r1(h[1]-4)}" width="16" height="8" rx="3" fill="${C.eq}"/>`;};
  s+=ln([cx-8,hy],[cx-11,148],10,C.ink)+ln([cx-11,148],[cx-12,186],8,C.ink)+ln([cx+8,hy],[cx+11,148],10,C.ink)+ln([cx+11,148],[cx+12,186],8,C.ink);
  s+=`<rect x="${cx-16}" y="${sy-6}" width="32" height="${hy-sy+8}" rx="12" fill="${C.ink}"/>`;
  s+=circ([cx,sy-17],10,C.ink)+arm(-1)+arm(1);
  return s;
}
/* ---- catálogo ---- */
const L=[ [100,186] ];
const X={
 'sentadilla-con-barra':{n:'Sentadilla con barra',m:'Cuádriceps, glúteos y zona media',
   A:{hip:[96,106.5],torso:3,arm:203,fore:353,ank:[100,186,'f'],ank2:[100,186,'f']},
   B:{hip:[72,150],torso:40,arm:240,fore:30,ank:[100,186,'f'],ank2:[100,186,'f']},
   eq:P=>plate(P.hand,17),
   pasos:['Barra apoyada en la parte alta de la espalda, pies al ancho de hombros.','Bajá llevando la cadera atrás y abajo, con el pecho arriba.','Bajá hasta que el muslo quede paralelo al piso y subí empujando con todo el pie.'],
   error:'Que las rodillas se vayan hacia adentro o que se levanten los talones.'},
 'sentadilla-goblet':{n:'Sentadilla goblet',m:'Cuádriceps, glúteos y zona media',
   A:{hip:[97,106.5],torso:2,arm:160,fore:20,ank:[100,186,'f'],ank2:[100,186,'f']},
   B:{hip:[80,152],torso:22,arm:180,fore:40,ank:[100,186,'f'],ank2:[100,186,'f']},
   eq:P=>goblet(P.hand),
   pasos:['Sostené la mancuerna vertical pegada al pecho.','Bajá con la espalda recta, los codos pasan entre las rodillas.','Subí empujando el piso, sin despegar los talones.'],
   error:'Redondear la espalda o alejar la mancuerna del cuerpo.'},
 'peso-muerto-rumano':{n:'Peso muerto rumano',m:'Isquiotibiales, glúteos y espalda baja',
   A:{hip:[98,106.5],torso:0,arm:180,fore:180,ank:[100,186,'f'],ank2:[100,186,'f']},
   B:{hip:[76,114],torso:70,hand:[106,168,'b'],hand2:[106,168,'b'],ank:[100,186,'f'],ank2:[100,186,'f']},
   eq:P=>plate(P.hand,17),
   pasos:['De pie con la barra frente a los muslos y rodillas apenas flexionadas.','Llevá la cadera hacia atrás y bajá la barra pegada a las piernas.','Cuando sientas estirar la parte de atrás del muslo, volvé apretando los glúteos.'],
   error:'Doblar la espalda o alejar la barra de las piernas.'},
 'prensa':{n:'Prensa 45°',m:'Cuádriceps y glúteos',
   A:{hip:[90,150],torso:-58,arm:160,fore:110,ank:[152,98,'u'],ank2:[152,98,'u'],foot:-45},
   B:{hip:[90,150],torso:-58,arm:160,fore:110,ank:[130,120,'u'],ank2:[130,120,'u'],foot:-45},
   scene:()=>{const h=[90,150];const b0=[h[0]-4,h[1]+11];const b1=add(b0,92,-58);
     return ln(b0,b1,7,C.pad)+ln([b0[0],b0[1]],[b0[0]+40,b0[1]],7,C.pad)+ln([b0[0]+20,b0[1]],[b0[0]+20,F],6,C.pad)+ln([124,F],[200,114],5,C.pad);},
   eq:P=>{const c=add(P.ank,7,45);return ln(add(c,24,-45),add(c,24,135),7,C.eq)+ln(add(c,6,45),add(add(c,6,45),18,45),12,C.eq);},
   pasos:['Espalda y cadera bien apoyadas en el respaldo, pies al ancho de hombros.','Bajá la plataforma doblando las rodillas hasta 90° sin despegar la cadera.','Empujá con todo el pie sin trabar las rodillas arriba.'],
   error:'Despegar la cadera del asiento al bajar o trabar las rodillas al final.'},
 'zancadas':{n:'Zancadas con mancuernas',m:'Cuádriceps, glúteos y equilibrio',
   A:{hip:[98,110],torso:0,arm:180,fore:180,ank:[128,186,'f'],ank2:[62,180,'b'],foot2:120},
   B:{hip:[95,150],torso:0,arm:180,fore:180,ank:[128,186,'f'],ank2:[60,180,'d'],foot2:120},
   eq:P=>disc(P.hand),
   pasos:['Un pie adelante y otro atrás, con una mancuerna en cada mano.','Bajá en línea recta hasta que la rodilla de atrás casi toque el piso.','Subí empujando con la pierna de adelante y repetí con el otro lado.'],
   error:'Inclinar el tronco hacia adelante o que la rodilla de adelante se vaya hacia adentro.'},
 'elevacion-talones':{n:'Elevación de talones',m:'Gemelos y sóleo',
   A:{hip:[98,106.5],torso:0,arm:180,fore:180,ank:[100,186,'f'],ank2:[100,186,'f'],foot:90},
   B:{hip:[100,97.5],torso:0,arm:180,fore:180,ank:[102,177,'f'],ank2:[102,177,'f'],foot:135},
   eq:P=>disc(P.hand),
   pasos:['De pie, piernas estiradas, mancuernas a los costados.','Subí en puntas de pie lo más alto que puedas.','Mantené un segundo arriba y bajá lento.'],
   error:'Rebotar o hacerlo rápido sin pausa arriba.'},
 'press-de-banca':{n:'Press de banca',m:'Pecho, hombros y tríceps',
   A:{hip:[118,144],torso:270,hand:[68,86,'f'],hand2:[68,86,'f'],ank:[150,186,'u'],ank2:[150,186,'u']},
   B:{hip:[118,144],torso:270,hand:[76,128,'d'],hand2:[76,128,'d'],ank:[150,186,'u'],ank2:[150,186,'u']},
   scene:()=>`<rect x="30" y="150" width="104" height="8" rx="3" fill="${C.pad}"/>`+ln([50,158],[50,F],6,C.pad)+ln([118,158],[118,F],6,C.pad)+ln([62,40],[62,F],5,C.pad),
   eq:P=>plate(P.hand,17),
   pasos:['Acostado en el banco, ojos debajo de la barra y pies firmes en el piso.','Bajá la barra controlada hasta la mitad del pecho.','Empujá hacia arriba sin despegar la espalda ni los glúteos del banco.'],
   error:'Rebotar la barra en el pecho o abrir los codos a 90°.'},
 'press-militar':{n:'Press militar con mancuernas',m:'Hombros y tríceps',
   A:{hip:[98,106.5],torso:0,hand:[108,56,'d'],hand2:[108,56,'d'],ank:[100,186,'f'],ank2:[100,186,'f']},
   B:{hip:[98,106.5],torso:0,hand:[101,-2,'f'],hand2:[101,-2,'f'],ank:[100,186,'f'],ank2:[100,186,'f']},
   eq:P=>disc(P.hand),
   pasos:['Mancuernas a la altura de los hombros, abdomen firme.','Empujá hacia arriba hasta estirar los brazos.','Bajá controlado hasta la altura de las orejas.'],
   error:'Arquear la espalda baja para empujar.'},
 'fondos':{n:'Fondos en paralelas',m:'Tríceps, pecho y hombros',
   A:{hip:[89,106],torso:8,hand:[100,112,'b'],hand2:[100,112,'b'],thigh:175,shin:255},
   B:{hip:[88,135],torso:25,hand:[100,112,'b'],hand2:[100,112,'b'],thigh:175,shin:255},
   scene:()=>ln([60,115],[150,115],6,C.pad)+ln([145,115],[145,F],6,C.pad),
   pasos:['Agarrate de las barras con los brazos estirados.','Bajá doblando los codos hacia atrás hasta 90°.','Subí empujando hasta estirar los brazos.'],
   error:'Bajar de más y cargar los hombros.'},
 'elevaciones-laterales':{n:'Elevaciones laterales',m:'Hombro (deltoides lateral)',front:true,A:{a:8},B:{a:84},
   pasos:['De pie, una mancuerna en cada mano, codos apenas flexionados.','Subí los brazos hacia los costados hasta la altura de los hombros.','Bajá lento, sin balancear el cuerpo.'],
   error:'Subir más alto que los hombros o tomar impulso con el cuerpo.'},

function clave(nombre){

  const els=[...(root||document).querySelectorAll('[data-ej]')];
  if(!els.length)return;

    const ph=((now-t0)/2600)%1;const t=ph<.5?ph*2:2-ph*2;
    els.forEach(el=>{if(!el.isConnected)return;el.innerHTML=frame(el.dataset.ej,Math.max(0,Math.min(1,(t-.12)/.76)));});

  };

  raf=requestAnimationFrame(step);
}

  const proximos=ORDEN.map(d=>D.turnos.filter(t=>Number(t.dia)===d).map(t=>DIAC[d]+' '+t.hora)).flat();
  const c=D.cuota;
  const chipC=c.estado==='pagado'?'<span class="chip c-ok">Pagada</span>':c.estado==='vencida'?'<span class="chip c-due">Vencida</span>':c.estado==='pendiente'?'<span class="chip c-warn">Pendiente</span>':'';
  const med=D.mediciones,ult=med[med.length-1],pri=med[0];
  const dif=ult&&pri&&ult!==pri&&typeof ult.peso==='number'&&typeof pri.peso==='number'?Math.round((ult.peso-pri.peso)*10)/10:null;
  const tel=waNum(D.entrenador.telefono);
  $('view').innerHTML=`
  ${avisosHTML()}
  <section id="hoy"><div class="h-sec">Hoy · ${DIA[D.dow]} ${fmt(D.hoy)}</div>
   <div class="card">${turnoHoy?`<div><div class="big">Entrenás a las ${esc(turnoHoy.hora)}</div><div class="small muted">¡Te esperamos!</div></div>`:`<div><div class="big">Hoy descansás</div><div class="small muted">${proximos.length?'Tus días: '+esc(proximos.join(' · ')):'Consultá tus días con tu entrenador'}</div></div>`}</div></section>
  <section id="rutina"><div class="h-sec">Tu rutina</div>
   ${D.rutina?`<div class="card"><div><div class="big" style="font-size:24px">${esc(D.rutina.titulo)}</div><div class="small muted">${[D.rutina.nivel,D.rutina.dias].filter(Boolean).map(esc).join(' · ')}</div></div>
    ${rutinaHTML(D.rutina.ejercicios)}${D.rutina.notas?`<p class="note">📝 ${esc(D.rutina.notas)}</p>`:''}</div>`:'<div class="empty">Tu entrenador todavía no te asignó una rutina.</div>'}</section>
  <section id="comidas"><div class="h-sec">Tus comidas</div>
   <div class="days" role="group" aria-label="Día">${ORDEN.map(d=>`<button data-act="dia" data-d="${d}" aria-pressed="${d===diaSel}">${d===D.dow?'Hoy':DIAC[d]}</button>`).join('')}</div>
   <div class="card" id="comidasDia">${comidasHTML(diaSel)}</div></section>
  ${D.recordatorios.length?`<section><div class="h-sec">Recordatorios</div><div class="card">${D.recordatorios.map(r=>`<div class="rec"><b>${fmt(r.fecha)}${r.hora?' · '+esc(r.hora):''}</b><span>${esc(r.texto)}</span></div>`).join('')}</div></section>`:''}
  <section id="progreso"><div class="h-sec">Tu progreso</div><div class="stats">
   <div class="stat"><div class="v">${D.asistenciasMes}</div><div class="l">entrenos este mes</div></div>
   <div class="stat"><div class="v">${ult&&typeof ult.peso==='number'?String(ult.peso).replace('.',','):'—'}</div><div class="l">peso kg</div></div>
   <div class="stat"><div class="v" style="color:${dif==null?'inherit':dif<0?'var(--ok)':'var(--warn)'}">${dif==null?'—':(dif>0?'+':'')+String(dif).replace('.',',')}</div><div class="l">desde el inicio</div></div></div></section>
  ${c.estado&&c.estado!=='sin'?`<section id="cuota"><div class="h-sec">Tu cuota</div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><div class="big" style="font-size:24px">${c.monto?gs(c.monto):'Este mes'}</div><div class="small muted">${c.estado==='pagado'?'Pagada este mes. ¡Gracias!':'Vence el '+fmt(c.vence)}</div></div>${chipC}</div></div></section>`:''}
  ${tel?`<a class="btn wa" href="https://wa.me/${tel}" target="_blank" rel="noopener">Escribirle a ${esc(D.entrenador.nombre.split(' ')[0])}</a>`:''}
  <p class="note" style="text-align:center">Plan Coach · tu entrenador actualiza esta información</p>`;
  if(window.EJ)EJ.animar($('rutina'));
}
async function cargar(){
  if(!T){$('view').innerHTML='<div class="empty"><b>Falta tu link</b>Abrí el link que te mandó tu entrenador por WhatsApp.</div>';return;}
  try{
    const r=await fetch('/api/a/'+encodeURIComponent(T));const b=await r.json().catch(()=>({}));
    if(!r.ok){$('view').innerHTML=`<div class="empty"><b>No pudimos abrir tu app</b>${esc(b.error||'Probá de nuevo más tarde.')}</div>`;return;}
    D=b;render();
    const h=location.hash.slice(1);if(h&&$(h))$(h).scrollIntoView();
  }catch(e){$('view').innerHTML='<div class="empty"><b>Sin conexión</b>Revisá tu internet y volvé a abrir la app.</div>';}
}
async function activar(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)){alertar(esIOS()&&!instalada()?'Primero agregá la app a la pantalla de inicio y abrila desde ahí.':'Este navegador no permite avisos. Probá con Chrome.');return;}
  const p=await Notification.requestPermission();if(p!=='granted'){alertar('No se dio permiso para los avisos.');return;}
  const reg=await navigator.serviceWorker.register('/sw.js');await navigator.serviceWorker.ready;
  const {clave}=await (await fetch('/api/push/clave')).json();if(!clave){alertar('Los avisos todavía no están disponibles.');return;}
  let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(clave)});
  const r=await fetch('/api/a/'+encodeURIComponent(T)+'/push',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sub:sub.toJSON()})});
  if(!r.ok){alertar('No se pudieron activar los avisos.');return;}
  try{localStorage.setItem('pc.alumno.avisos',T);}catch(e){}
  render();
}
function alertar(m){const el=document.createElement('div');el.className='card';el.style.borderColor='var(--warn)';el.textContent=m;$('view').prepend(el);setTimeout(()=>el.remove(),6000);}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;
  if(t.dataset.act==='avisos'){t.disabled=true;activar().catch(()=>alertar('No se pudieron activar los avisos.')).finally(()=>t.disabled=false);}
  if(t.dataset.act==='dia'){diaSel=Number(t.dataset.d);document.querySelectorAll('.days button').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.d)===diaSel)));$('comidasDia').innerHTML=comidasHTML(diaSel);}
});
cargar();
})();
</script>

<style>
/* Layout: app de una mano — encabezado fijo, contenido en tarjetas de lista, barra inferior con 5 pestañas, hojas que suben desde abajo */
:root{

  --accent:#1F55F0; --accent-soft:#E2E9FF; --on-accent:#FFFFFF;
  --ok:#1C7F47; --ok-soft:#DDF1E4; --due:#C23D28; --due-soft:#FBE3DE; --warn:#A86A00; --warn-soft:#FBEFD6;
  --ej-ink:#17201B; --ej-far:#9AA79F; --ej-eq:#5A6960; --ej-ground:#C9D2C7; --ej-pad:#C9D2C7;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1411; --surface:#18201B; --sunk:#121915; --ink:#E6ECE7; --muted:#94A59B; --line:#2A352E;
  --accent:#7192FF; --accent-soft:#1E2A4D; --on-accent:#0B1020;
  --ok:#5BC98A; --ok-soft:#163423; --due:#FF8A75; --due-soft:#3A1E19; --warn:#E3A93C; --warn-soft:#352812; --ej-ink:#E6ECE7; --ej-far:#5E6D64; --ej-eq:#94A59B; --ej-ground:#2F3B33; --ej-pad:#344038; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1411; --surface:#18201B; --sunk:#121915; --ink:#E6ECE7; --muted:#94A59B; --line:#2A352E;
  --accent:#7192FF; --accent-soft:#1E2A4D; --on-accent:#0B1020;
  --ok:#5BC98A; --ok-soft:#163423; --due:#FF8A75; --due-soft:#3A1E19; --warn:#E3A93C; --warn-soft:#352812; --ej-ink:#E6ECE7; --ej-far:#5E6D64; --ej-eq:#94A59B; --ej-ground:#2F3B33; --ej-pad:#344038; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px;padding-block:12px;min-height:58px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}.logo svg{width:22px;height:22px}
.brand{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand b{color:var(--accent)}
.hsub{color:var(--muted);font-size:13px;margin-left:auto;text-align:right}
.back{border:0;background:var(--sunk);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;flex:none}
.back svg{width:18px;height:18px}

main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
main .wrap{padding-block:16px;display:flex;flex-direction:column;gap:18px}
section{display:flex;flex-direction:column;gap:8px}

h1,h2,h3{text-wrap:balance;margin:0}
.h-sec{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.h-sec .n{background:var(--sunk);color:var(--ink);border-radius:20px;padding:0 8px;font-size:13px;letter-spacing:0;font-variant-numeric:tabular-nums}
.h-sec .lnk{margin-left:auto;border:0;background:none;color:var(--accent);font-family:var(--body);font-size:13px;letter-spacing:0;text-transform:none;font-weight:600;padding:0}
.big{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.02;text-transform:uppercase;letter-spacing:.01em}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.stat .v{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}

@media (max-width:380px){.act{font-size:12px}.stat .v{font-size:26px}.money{font-size:24px}.grid4{grid-template-columns:1fr 1fr}}

<script>
/* ===== Ilustraciones de ejercicios: figura de perfil animada entre dos posiciones ===== */
var EJ=(function(){
const LEN={torso:52,thigh:40,shin:40,ua:30,fa:28,neck:13,foot:11};
const F=190; // piso
const dir=a=>{const r=a*Math.PI/180;return [Math.sin(r),-Math.cos(r)];};
const add=(p,l,a)=>{const d=dir(a);return [p[0]+d[0]*l,p[1]+d[1]*l];};
const angTo=(a,b)=>Math.atan2(b[0]-a[0],-(b[1]-a[1]))*180/Math.PI;
function ik(base,t,a,b,bend){
  let dx=t[0]-base[0],dy=t[1]-base[1];let d=Math.hypot(dx,dy);
  const dm=Math.min(a+b-0.01,Math.max(Math.abs(a-b)+0.01,d));
  const ux=dx/(d||1),uy=dy/(d||1);
  const ca=(a*a+dm*dm-b*b)/(2*a*dm),al=Math.acos(Math.max(-1,Math.min(1,ca)));
  const phi=Math.atan2(uy,ux);
  const c1=[base[0]+a*Math.cos(phi+al),base[1]+a*Math.sin(phi+al)];
  const c2=[base[0]+a*Math.cos(phi-al),base[1]+a*Math.sin(phi-al)];
  let j;
  if(bend==='f')j=c1[0]>=c2[0]?c1:c2;else if(bend==='b')j=c1[0]<c2[0]?c1:c2;
  else if(bend==='u')j=c1[1]<c2[1]?c1:c2;else j=c1[1]>=c2[1]?c1:c2;
  const end=[base[0]+ux*dm,base[1]+uy*dm];
  // extremo real desde la articulación
  const e2=[j[0]+(end[0]-j[0])*b/Math.hypot(end[0]-j[0],end[1]-j[1]),j[1]+(end[1]-j[1])*b/Math.hypot(end[0]-j[0],end[1]-j[1])];
  return [j,e2];
}
function fk(p){
  const P={hip:p.hip};
  const torso=p.torsoTo?angTo(p.hip,p.torsoTo):p.torso;
  P.sh=add(P.hip,LEN.torso,torso);
  P.head=add(P.sh,LEN.neck,torso+(p.head||0));
  const leg=(s)=>{const t=p['ank'+s];let k,a;
    if(t){[k,a]=ik(P.hip,t,LEN.thigh,LEN.shin,t[2]||'f');}

const uid=()=>'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad=n=>String(n).padStart(2,'0');
const isoDate=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const HOY=()=>isoDate(new Date());
const MESACT=()=>HOY().slice(0,7);
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESL=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIA=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const DIAC=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const ORDEN_SEM=[1,2,3,4,5,6,0];
const COMIDAS=[['desayuno','Desayuno'],['almuerzo','Almuerzo'],['merienda','Merienda'],['cena','Cena']];
function toD(f){const[y,m,d]=f.split('-').map(Number);return new Date(y,m-1,d);}
function fmt(f){if(!f)return'';const[y,m,d]=f.split('-');return +d+' '+MES[+m-1];}
function addDays(f,n){const t=toD(f);t.setDate(t.getDate()+n);return isoDate(t);}
function diffDays(f){const a=toD(f);const b=new Date();b.setHours(0,0,0,0);return Math.round((b-a)/864e5);}
function dow(f){return toD(f).getDay();}
function mesLabel(m){const[y,mm]=m.split('-');return MESL[+mm-1]+' '+y;}
function mesAdd(m,n){const[y,mm]=m.split('-').map(Number);const d=new Date(y,mm-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function finMes(m){const[y,mm]=m.split('-').map(Number);return isoDate(new Date(y,mm,0));}
function gs(n){return 'Gs. '+String(Math.round(Number(n)||0)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
function miles(n){return String(Math.round(Number(n)||0)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
function inicial(n){return (String(n||'?').trim()[0]||'?').toUpperCase();}
function nom1(a){return String(a&&a.nombre||'').split(' ')[0];}
function waNum(t){let d=String(t||'').replace(/\D/g,'');if(!d)return'';if(d.startsWith('0'))d='595'+d.slice(1);else if(d.length===9&&d.startsWith('9'))d='595'+d;return d;}
function waLink(t,txt){const n=waNum(t);return 'https://wa.me/'+(n||'')+'?text='+encodeURIComponent(txt);}
const N=v=>{const x=Number(String(v==null?'':v).replace(',','.'));return isFinite(x)?x:0;};

const queues={};
function persist(col,id,obj){
  if(!DB){saveLocal();return;}
  const k=col+'/'+id;
  queues[k]=(queues[k]||Promise.resolve()).then(()=>obj===null?DB.collection(col).doc(id).delete():DB.collection(col).doc(id).set(JSON.parse(JSON.stringify(obj)))).catch(e=>{
    toast(e&&e.code==='quota_exceeded'?'Se llenó el espacio. Borrá alumnos que ya no uses.':'No se pudo guardar. Revisá la conexión.');
  });
}
function put(col,id,obj){S[col][id]=obj;persist(col,id,obj);render();}
function del(col,id){delete S[col][id];persist(col,id,null);render();}
function mod(aid,fn){const a=JSON.parse(JSON.stringify(S.alumnos[aid]));fn(a);put('alumnos',aid,a);}
function loadLocal(){try{const r=localStorage.getItem('plancoach.demo');if(r){const o=JSON.parse(r);COLS.forEach(c=>S[c]=o[c]||{});}}catch(e){}}
function saveLocal(){try{localStorage.setItem('plancoach.demo',JSON.stringify(S));}catch(e){}}

const arr=(a,k)=>Array.isArray(a&&a[k])?a[k]:[];
function pendientes(a){return arr(a,'recordatorios').filter(r=>!r.enviado&&r.fecha<=HOY());}
function proximos(a){const lim=addDays(HOY(),7);return arr(a,'recordatorios').filter(r=>!r.enviado&&r.fecha>HOY()&&r.fecha<=lim);}
function ultimoContacto(a){const h=arr(a,'historial');if(!h.length)return null;return h.reduce((m,e)=>e.fecha>m?e.fecha:m,'');}
function alumnosOrden(){return Object.entries(S.alumnos).map(([id,a])=>({id,...a})).sort((x,y)=>String(x.nombre).localeCompare(String(y.nombre)));}
function hace(f){if(!f)return'sin envíos';const d=diffDays(f);return d<=0?'hoy':d===1?'ayer':'hace '+d+' días';}
function tag(o){return o&&o.ejemplo?' <span class="chip c-n">Ejemplo</span>':'';}
function pesoActual(a){const m=arr(a,'mediciones').filter(x=>typeof x.peso==='number').sort((x,y)=>x.fecha.localeCompare(y.fecha));return m.length?m[m.length-1].peso:null;}

// cuotas
function estadoCuota(a,m){
  const pago=arr(a,'pagos').find(p=>p.mes===m);
  if(pago)return {k:'pagado',pago};
  const c=a.cuota||{};if(!N(c.monto))return {k:'sin'};
  if(a.inicio&&a.inicio>finMes(m))return {k:'no'};
  const venc=m+'-'+pad(Math.min(28,Math.max(1,N(c.dia)||10)));
  if(m<MESACT()||(m===MESACT()&&HOY()>venc))return {k:'vencida',venc};
  return {k:'pendiente',venc};
}
function chipCuota(e){return e.k==='pagado'?'<span class="chip c-ok">Pagado</span>':e.k==='vencida'?'<span class="chip c-due">Vencida</span>':e.k==='pendiente'?'<span class="chip c-warn">Vence '+fmt(e.venc)+'</span>':'<span class="chip c-n">Sin cuota</span>';}

// turnos y asistencia
function turnosDelDia(f){const d=dow(f);const out=[];alumnosOrden().forEach(a=>arr(a,'turnos').forEach(t=>{if(+t.dia===d)out.push({a,hora:t.hora||''});}));return out.sort((x,y)=>x.hora.localeCompare(y.hora));}
function vino(a,f){return arr(a,'asistencias').includes(f);}

// macros
function totalDia(a,d){const p=(a.plan||{})[d]||{};let k=0,pr=0,c=0,g=0,n=0;COMIDAS.forEach(([key])=>{const r=S.recetas[p[key]];if(r){k+=N(r.kcal);pr+=N(r.prot);c+=N(r.carb);g+=N(r.grasa);n++;}});return {k,pr,c,g,n};}
function calcular(o){
  const p=N(o.peso),h=N(o.altura),e=N(o.edad);if(!p||!h||!e)return null;
  const bmr=10*p+6.25*h-5*e+(o.sexo==='Mujer'?-161:5);
  const tdee=bmr*N(o.actividad||1.375);
  const obj=String(o.objetivo||'').toLowerCase();
  let kcal=tdee,protKg=1.6;
  if(obj.includes('bajar'))     {kcal=tdee*0.8;protKg=2.0;}
  else if(obj.includes('ganar')){kcal=tdee*1.1;protKg=2.0;}
  else if(obj.includes('recomp')){kcal=tdee*0.95;protKg=2.0;}
  else if(obj.includes('rendim')){kcal=tdee*1.05;protKg=1.8;}
  const prot=Math.round(p*protKg),grasa=Math.round(p*0.9);
  const carb=Math.max(0,Math.round((kcal-prot*4-grasa*9)/4));
  return {bmr:Math.round(bmr),tdee:Math.round(tdee),kcal:Math.round(kcal/10)*10,prot,carb,grasa};
}

// textos de WhatsApp
function textoReceta(r,nombre){
  const L=['Hola '+(nombre||'')+' 👋 te paso la receta de hoy:','','*'+r.titulo+'*'];
  const m=[];if(r.kcal)m.push(r.kcal+' kcal');if(r.prot)m.push('P '+r.prot+' g');if(r.carb)m.push('C '+r.carb+' g');if(r.grasa)m.push('G '+r.grasa+' g');
  if(m.length)L.push(m.join(' · ')+(r.porciones?' (por porción, rinde '+r.porciones+')':''));
  if(r.ingredientes){L.push('','*Ingredientes*');String(r.ingredientes).split('\n').filter(Boolean).forEach(x=>L.push('• '+x.trim()));}
  if(r.pasos){L.push('','*Preparación*');String(r.pasos).split('\n').filter(Boolean).forEach((x,i)=>L.push((i+1)+'. '+x.trim()));}
  return L.join('\n');
}
function slug(n){return String(n).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,80)||'ejercicio';}
function lineasEj(r){return String(r&&r.ejercicios||'').split('\n').map(x=>x.trim()).filter(Boolean);}
function nombreEj(l){return l.split(/\s+[—–-]\s+/)[0].trim();}
function infoEj(l){return S.ejercicios[slug(nombreEj(l))]||null;}
const GUIA=location.origin+'/guia';
function videoEj(l){const i=infoEj(l);if(i&&i.video)return i.video;const k=EJ.clave(nombreEj(l));return k?GUIA+'#'+k:'https://www.youtube.com/results?search_query='+encodeURIComponent(nombreEj(l)+' técnica correcta');}
function textoRutina(r,nombre){
  const L=['Hola '+(nombre||'')+' 💪 esta es tu rutina:','','*'+r.titulo+'*'];
  const m=[];if(r.nivel)m.push(r.nivel);if(r.dias)m.push(r.dias);if(m.length)L.push(m.join(' · '));
  const ls=lineasEj(r);
  if(ls.length){L.push('');ls.forEach((x,i)=>{const inf=infoEj(x);L.push('*'+(i+1)+'.* '+x);if(inf&&inf.tips)L.push('   💡 '+inf.tips);L.push('   ▶️ Cómo se hace: '+videoEj(x));L.push('');});L.pop();}
  if(r.notas)L.push('',r.notas);
  return L.join('\n');
}
function textoPlan(a){
  const L=['Hola '+nom1(a)+' 🥗 este es tu plan de comidas de la semana:'];
  const mc=a.macros;if(mc&&mc.kcal)L.push('','Objetivo diario: '+miles(mc.kcal)+' kcal · P '+mc.prot+' g · C '+mc.carb+' g · G '+mc.grasa+' g');
  ORDEN_SEM.forEach(d=>{const p=(a.plan||{})[d]||{};const filas=COMIDAS.filter(([k])=>S.recetas[p[k]]).map(([k,l])=>l+': '+S.recetas[p[k]].titulo);
    if(filas.length){L.push('','*'+DIA[d][0].toUpperCase()+DIA[d].slice(1)+'*');filas.forEach(x=>L.push('• '+x));const t=totalDia(a,d);if(t.k)L.push('  ≈ '+miles(t.k)+' kcal · P '+Math.round(t.pr)+' g');}});
  L.push('','Si querés la receta de alguna comida, pedímela y te la paso.');
  return L.join('\n');
}
function textoResumen(a,m){
  const ini=m+'-01',fin=finMes(m);
  const med=arr(a,'mediciones').slice().sort((x,y)=>x.fecha.localeCompare(y.fecha));
  const delMes=med.filter(x=>x.fecha>=ini&&x.fecha<=fin);
  const antes=med.filter(x=>x.fecha<ini);
  const ref=antes.length?antes[antes.length-1]:delMes[0];
  const ult=delMes[delMes.length-1];
  const asis=arr(a,'asistencias').filter(f=>f>=ini&&f<=fin).length;
  const rec=arr(a,'historial').filter(e=>e.fecha>=ini&&e.fecha<=fin&&e.tipo==='Receta').length;
  const L=['Hola '+nom1(a)+' 👏 este es tu resumen de '+mesLabel(m)+':',''];
  if(asis)L.push('🏋️ Entrenaste '+asis+(asis===1?' vez':' veces'));
  const dif=(k,u,txt)=>{if(ref&&ult&&ref!==ult&&typeof ref[k]==='number'&&typeof ult[k]==='number'){const d=Math.round((ult[k]-ref[k])*10)/10;L.push(txt+' '+(d>0?'+':'')+String(d).replace('.',',')+' '+u+' (ahora '+String(ult[k]).replace('.',',')+' '+u+')');}};
  dif('peso','kg','⚖️ Peso:');dif('grasa','%','📉 Grasa corporal:');dif('cintura','cm','📏 Cintura:');
  if(rec)L.push('🥗 Recibiste '+rec+(rec===1?' receta nueva':' recetas nuevas'));
  if(L.length===2)L.push('Este mes todavía no tenemos mediciones ni asistencias registradas.');
  L.push('','¡Vamos por más el mes que viene! 💪');
  return L.join('\n');
}

function listaAlumnosHTML(){
  const q=UI.q.trim().toLowerCase();
  const al=alumnosOrden().filter(a=>!q||String(a.nombre).toLowerCase().includes(q)||String(a.objetivo||'').toLowerCase().includes(q));

function fotosHTML(a){
  const fotos=arr(a,'fotos');
  const porFecha={};fotos.forEach(f=>{(porFecha[f.fecha]=porFecha[f.fecha]||[]).push(f);});

  const POSES=['frente','perfil','espalda'];
  let html=`<div class="card"><div class="h-sec">Fotos de progreso <span class="n">${fotos.length}</span>${fechas.length>1?'<button class="lnk" data-act="comparar">Comparar</button>':''}</div>`;
  if(!ASSETS&&!fotos.length){html+='<p class="note">En la versión completa el entrenador sube fotos de frente, perfil y espalda, y las compara lado a lado por fecha.</p></div>';return html;}
  html+=fechas.length?fechas.map(f=>`<div class="ph-row"><div class="small muted">${fmt(f)} ${f.slice(0,4)}</div><div class="ph-grid">${porFecha[f].sort((x,y)=>POSES.indexOf(x.pose)-POSES.indexOf(y.pose)).map(p=>`<button class="ph" data-act="verFoto" data-f="${p.fid}"><img src="/_blob/${esc(p.asset)}" alt="${esc(p.pose)} ${fmt(f)}" loading="lazy" onerror="this.style.visibility='hidden'"><span class="lb">${esc(p.pose)}</span></button>`).join('')}</div></div>`).join(''):'<p class="note">Frente, perfil y espalda con la misma luz y ropa, una vez por mes.</p>';
  if(ASSETS)html+=`<button class="btn full" data-act="foto">+ Agregar fotos</button>`;
  return html+'</div>';
}

function chartPeso(pts){
  if(pts.length<2)return '<div class="card small muted">Con dos mediciones o más vas a ver acá la curva de peso.</div>';
  const W=340,H=150,pl=34,pr=12,pt=14,pb=24;
  const ys=pts.map(p=>p.peso);let mn=Math.floor(Math.min(...ys)-1),mx=Math.ceil(Math.max(...ys)+1);
  const x=i=>pl+(W-pl-pr)*(i/(pts.length-1));
  const y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  const line=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.peso).toFixed(1)).join(' ');
  const area=line+` L${x(pts.length-1).toFixed(1)} ${H-pb} L${pl} ${H-pb} Z`;
  const ticks=[mn,(mn+mx)/2,mx];
  return `<div class="card"><div class="h-sec">Peso (kg)</div><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución del peso">
   ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${Math.round(t*10)/10}</text>`).join('')}
   <path d="${area}" fill="var(--accent-soft)" stroke="none"/>
   <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
   ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.peso)}" r="${i===pts.length-1?5:3}" fill="${i===pts.length-1?'var(--accent)':'var(--surface)'}" stroke="var(--accent)" stroke-width="2"/>`).join('')}
   <text x="${pl}" y="${H-6}" font-size="11" fill="var(--muted)">${fmt(pts[0].fecha)}</text>
   <text x="${W-pr}" y="${H-6}" font-size="11" fill="var(--muted)" text-anchor="end">${fmt(pts[pts.length-1].fecha)}</text>
  </svg></div>`;
}

     <div style="display:flex;justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap"><div><div class="small muted">Cobrado</div><div class="money" style="color:var(--ok)">${gs(cobrado)}</div></div><div style="text-align:right"><div class="small muted">Falta cobrar</div><div class="money" style="color:${falta?'var(--due)':'inherit'}">${gs(falta)}</div></div></div>

     <div class="small muted">${pct}% de ${gs(esperado)} · ${conCuota.filter(x=>x.e.k==='pagado').length} de ${conCuota.length} alumnos pagaron</div>

const val=id=>{const e=document.getElementById(id);return e?String(e.value).trim():'';};
const num=id=>{const s=val(id).replace(/\./g,'').replace(',','.');return s===''?null:Number(s);};
const dec=id=>{const s=val(id).replace(',','.');return s===''?null:Number(s);};

function saveAlumno(id){
  const nombre=val('fNom');if(!nombre){toast('Escribí el nombre del alumno.');return;}
  const base=id?JSON.parse(JSON.stringify(S.alumnos[id])):{historial:[],recordatorios:[],mediciones:[],pagos:[],asistencias:[],fotos:[]};
  const turnos=ORDEN_SEM.filter(d=>document.getElementById('td'+d).checked).map(d=>({dia:d,hora:val('th'+d)||'18:00'}));
  const a=Object.assign(base,{nombre,tel:val('fTel'),objetivo:val('fObj'),sexo:val('fSexo'),edad:val('fEdad'),altura:val('fAlt'),actividad:val('fAct'),inicio:val('fIni'),restricciones:val('fRes'),notas:val('fNot'),turnos});
  if(!id){const p=dec('fPeso'),g=dec('fGr');if(p!=null||g!=null)a.mediciones=[{fid:uid(),fecha:a.inicio||HOY(),peso:p,grasa:g,cintura:null}];
    const mo=num('fMonto');if(mo)a.cuota={monto:mo,dia:N(val('fDia'))||10};}
  const nid=id||uid();put('alumnos',nid,a);close();
  if(!id){UI.tab='alumnos';UI.alumno=nid;UI.sub='historial';render();}
  toast(id?'Ficha actualizada':'Alumno agregado');
}

async function saveEj(n,btn){
  const k=slug(n),prev=S.ejercicios[k]||{};
  let video=val('ejV');if(video&&!/^https?:\/\//i.test(video))video='https://'+video;
  const o={nombre:n,foto:prev.foto||'',video,tips:val('ejT')};
  const fi=document.getElementById('ejF');const file=fi&&fi.files&&fi.files[0];
  if(file&&ASSETS){btn.disabled=true;btn.textContent='Subiendo foto…';
    try{const blob=await comprimir(file);const r=await ASSETS.upload(blob,{type:/^image\/(jpeg|png|webp|gif)$/.test(blob.type)?blob.type:'image/jpeg'});
      const vieja=prev.foto;o.foto=r.id;if(vieja){ASSETS.delete(vieja).catch(()=>{});}}
    catch(e){btn.disabled=false;btn.textContent='Guardar';toast(e&&e.code==='too_large'?'La foto es muy pesada.':'No se pudo subir la foto.');return;}}
  put('ejercicios',k,o);toast('Ejercicio guardado');
  if(LIBOPEN&&S[LIBOPEN.col][LIBOPEN.id])formLib(LIBOPEN.col,LIBOPEN.id);else close();
}

let RECETARIO=null;const RF=window.RF={q:'',c:'Todas',n:40};
async function abrirRecetario(){
  if(!RECETARIO){sheet('<h2>Recetario</h2><p class="note">Cargando recetas…</p>');
    try{RECETARIO=await (await fetch('/recetario.json')).json();}catch(e){sheet('<h2>Recetario</h2><div class="empty"><b>No se pudo cargar</b>Revisá tu conexión e intentá de nuevo.</div>');return;}}
  RF.n=40;sheet(`<h2>Recetario</h2><p class="note">${RECETARIO.length} recetas fitness bajas en carbohidratos. Tocá una para verla y agregarla a tu biblioteca.</p>
   <div class="f"><label for="rfQ">Buscar</label><input id="rfQ" type="search" placeholder="Ej: pollo, huevo, postre" value="${esc(RF.q)}" oninput="RF.q=this.value;RF.n=40;listaRecetario()"></div>
   <div class="seg" style="flex-wrap:wrap" role="group" aria-label="Categoría">${['Todas',...new Set(RECETARIO.map(r=>r.etiqueta))].map(c=>`<button data-act="rfCat" data-k="${esc(c)}" aria-pressed="${c===RF.c}">${esc(c)}</button>`).join('')}</div>
   <div id="rfLista"></div>`);
  listaRecetario();
}
window.listaRecetario=listaRecetario;function listaRecetario(){
  const el=document.getElementById('rfLista');if(!el)return;
  const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');const q=norm(RF.q.trim());
  const ya=new Set(Object.values(S.recetas).map(o=>norm(o.titulo)));
  const res=RECETARIO.map((r,i)=>({r,i})).filter(({r})=>(RF.c==='Todas'||r.etiqueta===RF.c)&&(!q||norm(r.titulo+' '+r.ingredientes).includes(q)));
  el.innerHTML=res.length?`<div class="list">${res.slice(0,RF.n).map(({r,i})=>`<button class="row" data-act="rfVer" data-i="${i}"><div class="main"><div class="t">${esc(r.titulo)}${ya.has(norm(r.titulo))?' <span class="chip c-ok">En tu biblioteca</span>':''}</div><div class="s">${[r.etiqueta,r.tiempo,r.porciones?r.porciones+' porciones':''].filter(Boolean).map(esc).join(' · ')}</div></div><span class="chev">${I.chev}</span></button>`).join('')}</div>${res.length>RF.n?`<button class="btn full" data-act="rfMas">Ver más (${res.length-RF.n})</button>`:''}`
   :'<div class="empty"><b>Sin resultados</b>Probá con otra palabra.</div>';
}

function saveLib(col,id){
  const titulo=val('lT');if(!titulo){toast('Poné un nombre.');return;}
  const prev=id?S[col][id]:{};let o;
  if(col==='recetas')o={titulo,kcal:val('lK'),porciones:val('lPo'),prot:val('lP'),carb:val('lC'),grasa:val('lG'),etiqueta:val('lE'),ingredientes:val('lI'),pasos:val('lS')};
  else o={titulo,nivel:val('lN'),dias:val('lD'),ejercicios:val('lX'),notas:val('lO')};
  if(prev.ejemplo)o.ejemplo=true;
  put(col,id||uid(),o);close();toast('Guardado');
}

let PEND=null;
function preview(aid,tipo,titulo,texto,extra){
  const a=S.alumnos[aid];PEND={aid,tipo,titulo,extra};
  sheet(`<h2>${esc(tipo)} para ${esc(nom1(a))}</h2>
  <div class="f"><label for="pMsg">Mensaje (podés editarlo)</label><textarea id="pMsg" class="msg">${esc(texto)}</textarea></div>
  ${a.tel?'':'<p class="note" style="color:var(--warn)">Este alumno no tiene WhatsApp cargado: vas a elegir el contacto en WhatsApp.</p>'}
  <a class="btn wa full" id="waGo" href="#" target="_blank" rel="noopener">Abrir en WhatsApp y registrar</a>
  <div class="btns"><button class="btn" data-act="copy">Copiar texto</button><button class="btn" data-act="logOnly">Registrar sin enviar</button></div>
  <p class="note">El envío queda en el historial del alumno. En WhatsApp solo tenés que tocar enviar.</p>`);
  const ta=document.getElementById('pMsg'),go=document.getElementById('waGo');
  const upd=()=>{go.href=waLink(a.tel,ta.value);};upd();ta.addEventListener('input',upd);
}
function registrar(){
  if(!PEND)return;const {aid,tipo,titulo,extra}=PEND;const texto=val('pMsg');PEND=null;
  mod(aid,a=>{
    a.historial=arr(a,'historial');a.historial.push({fecha:HOY(),ts:new Date().toTimeString().slice(0,5),tipo,titulo,texto});
    if(extra&&extra.rec){a.recordatorios=arr(a,'recordatorios').map(r=>{if(r.id!==extra.rec)return r;
      if(r.repetir==='diario')return Object.assign({},r,{fecha:addDays(HOY(),1)});
      if(r.repetir==='semanal')return Object.assign({},r,{fecha:addDays(r.fecha<HOY()?HOY():r.fecha,7)});
      return Object.assign({},r,{enviado:true});});}
    if(a.historial.length>300)a.historial=a.historial.slice(-300);
  });
  close();toast('Registrado en el historial');
}

async function comprimir(file){
  try{const img=await createImageBitmap(file);const s=Math.min(1,1280/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',0.82));}catch(e){return file;}
}
async function saveFotos(aid,btn){
  const fecha=val('ffF')||HOY();const nuevas=[];
  const items=['frente','perfil','espalda'].map(p=>({p,f:(document.getElementById('ff_'+p).files||[])[0]})).filter(x=>x.f);
  if(!items.length){toast('Elegí al menos una foto.');return;}
  btn.disabled=true;btn.textContent='Subiendo…';
  for(const it of items){
    try{const blob=await comprimir(it.f);const r=await ASSETS.upload(blob,{type:blob.type&&/^image\/(jpeg|png|webp|gif)$/.test(blob.type)?blob.type:'image/jpeg'});nuevas.push({fid:uid(),fecha,pose:it.p,asset:r.id});}
    catch(e){toast(e&&e.code==='too_large'?'Una foto es muy pesada.':e&&e.code==='quota_or_state'?'Se llenó el espacio de fotos.':'No se pudo subir una foto.');}
  }
  if(nuevas.length)mod(aid,a=>{a.fotos=arr(a,'fotos').filter(f=>!(f.fecha===fecha&&nuevas.some(n=>n.pose===f.pose))).concat(nuevas);});
  close();if(nuevas.length){UI.sub='progreso';render();toast(nuevas.length+(nuevas.length===1?' foto guardada':' fotos guardadas'));}
}

function comparar(aid,d1,d2,pose){

  d1=d1||fechas[0];d2=d2||fechas[fechas.length-1];pose=pose||'frente';
  const pic=d=>{const f=fotos.find(x=>x.fecha===d&&x.pose===pose);return f?`<div class="ph"><img src="/_blob/${esc(f.asset)}" alt="${pose} ${fmt(d)}"></div>`:'<div class="ph" style="display:grid;place-items:center;font-size:12px;color:var(--muted)">Sin foto</div>';};
  const opt=sel=>fechas.map(f=>`<option value="${f}" ${f===sel?'selected':''}>${fmt(f)} ${f.slice(0,4)}</option>`).join('');
  sheet(`<h2>Comparar</h2>

  <div class="cmp"><figure>${pic(d1)}<figcaption>${fmt(d1)}</figcaption></figure><figure>${pic(d2)}<figcaption>${fmt(d2)}</figcaption></figure></div>`);
  CMP={aid,pose};
}
